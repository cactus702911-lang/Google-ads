<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="favicon.svg" sizes="any">
    <title>Admin CMS - DigitalGrowth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: sans-serif; }
        .input-group { margin-bottom: 1rem; }
        .input-label { display: block; font-size: 0.875rem; margin-bottom: 0.5rem; color: #94a3b8; font-weight: 600; }
        .input-field { width: 100%; background: #1e293b; border: 1px solid #334155; color: white; padding: 0.5rem; border-radius: 0.375rem; }
        .input-field:focus { outline: none; border-color: #38bdf8; }
        .section-card { background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 2rem; }
        .btn-primary { background: #0284c7; color: white; padding: 0.5rem 1rem; border-radius: 0.375rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn-primary:hover { background: #0ea5e9; }
        .btn-success { background: #16a34a; color: white; padding: 0.75rem 1.5rem; border-radius: 0.375rem; font-weight: bold; cursor: pointer; display: inline-block; transition: background 0.2s; }
        .btn-success:hover { background: #22c55e; }
        .btn-danger { background: #ef4444; color: white; padding: 0.25rem 0.5rem; border-radius: 0.25rem; font-size: 0.75rem; cursor: pointer; }
        .btn-danger:hover { background: #dc2626; }
        
        /* Quill Dark Mode Overrides */
        .ql-toolbar { background: #334155; border-color: #475569 !important; border-top-left-radius: 0.375rem; border-top-right-radius: 0.375rem; }
        .ql-container { background: #1e293b; border-color: #475569 !important; color: white; border-bottom-left-radius: 0.375rem; border-bottom-right-radius: 0.375rem; font-size: 1rem; }
        .ql-stroke { stroke: #cbd5e1 !important; }
        .ql-fill { fill: #cbd5e1 !important; }
        .ql-picker { color: #cbd5e1 !important; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="min-h-screen pb-24">

    <!-- Auth Overlay -->
    <div id="auth-overlay" class="fixed inset-0 bg-[#0f172a] z-50 flex flex-col items-center justify-center">
        <h1 class="text-3xl font-bold mb-6 text-white flex items-center gap-2">
            <i data-lucide="shield-check" class="text-blue-400"></i> Admin CMS
        </h1>
        <div class="bg-[#1e293b] p-8 rounded-xl border border-[#334155] shadow-2xl w-80">
            <label class="text-sm text-slate-400 mb-2 block">Access Key</label>
            <input type="password" id="password-input" placeholder="Enter Password" class="input-field mb-4">
            <button type="button" onclick="checkAuth()" class="btn-primary w-full py-2 flex items-center justify-center gap-2">
                <span>Login</span>
            </button>
            <div class="mt-6 border-t border-slate-700 pt-4 text-center">
                <p class="text-xs text-slate-500">Default Password: <strong>admin123</strong></p>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div id="cms-content" class="hidden max-w-7xl mx-auto px-4 py-8">
        
        <!-- Header -->
        <div class="flex flex-col md:flex-row items-center justify-between mb-8 gap-4">
            <div class="flex items-center gap-3">
                <span class="bg-blue-500/10 text-blue-400 p-2 rounded-lg border border-blue-500/20"><i data-lucide="layout-dashboard"></i></span>
                <div>
                    <h1 class="text-2xl font-bold text-white leading-tight">DigitalGrowth CMS</h1>
                    <div class="flex items-center gap-2 mt-0.5">
                        <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-700 text-slate-300 uppercase tracking-wider font-bold">ADMIN</span>
                        <button onclick="logout()" class="text-slate-500 hover:text-red-400 text-xs flex items-center gap-1 transition-colors">
                            <i data-lucide="log-out" class="w-3 h-3"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
            <div class="flex flex-wrap gap-2" id="nav-tabs">
                <button onclick="switchTab('general', this)" class="nav-btn px-4 py-2 rounded-lg text-sm font-bold transition bg-blue-600 text-white shadow-lg shadow-blue-500/20">General</button>
                <button onclick="switchTab('home', this)" class="nav-btn px-4 py-2 rounded-lg text-sm font-bold transition bg-slate-800 text-slate-400 hover:bg-slate-700">Home Page</button>
                <button onclick="switchTab('services', this)" class="nav-btn px-4 py-2 rounded-lg text-sm font-bold transition bg-slate-800 text-slate-400 hover:bg-slate-700">Services</button>
                <button onclick="switchTab('portfolio', this)" class="nav-btn px-4 py-2 rounded-lg text-sm font-bold transition bg-slate-800 text-slate-400 hover:bg-slate-700">Portfolio</button>
                <button onclick="switchTab('blog', this)" class="nav-btn px-4 py-2 rounded-lg text-sm font-bold transition bg-slate-800 text-slate-400 hover:bg-slate-700">Blog</button>
            </div>
        </div>

        <!-- Tab: General -->
        <div id="tab-general" class="tab-content">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Header / Identity -->
                <div class="section-card">
                    <h2 class="text-xl font-bold text-white mb-4 border-b border-slate-700 pb-2 flex items-center gap-2"><i data-lucide="globe"></i> Identity & Header</h2>
                    <div class="input-group">
                        <label class="input-label">Logo Text</label>
                        <input type="text" id="g-logo" class="input-field">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Notification Bar Text</label>
                        <input type="text" id="g-notification" class="input-field">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Header CTA Button Text</label>
                        <input type="text" id="g-cta" class="input-field">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Categories (Comma separated, used in header nav)</label>
                        <input type="text" id="g-categories" class="input-field">
                    </div>
                </div>

                <!-- Contact & Social -->
                <div class="section-card">
                    <h2 class="text-xl font-bold text-white mb-4 border-b border-slate-700 pb-2 flex items-center gap-2"><i data-lucide="contact"></i> Contact & Social</h2>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="input-group">
                            <label class="input-label">Email</label>
                            <input type="text" id="g-email" class="input-field">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Phone</label>
                            <input type="text" id="g-phone" class="input-field">
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Address</label>
                        <input type="text" id="g-address" class="input-field">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="input-group">
                            <label class="input-label">WhatsApp</label>
                            <input type="text" id="g-whatsapp" class="input-field" placeholder="+123456789">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Facebook URL</label>
                            <input type="text" id="g-facebook" class="input-field">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Twitter URL</label>
                            <input type="text" id="g-twitter" class="input-field">
                        </div>
                        <div class="input-group">
                            <label class="input-label">LinkedIn URL</label>
                            <input type="text" id="g-linkedin" class="input-field">
                        </div>
                    </div>
                </div>
                
                <!-- SEO & Footer -->
                <div class="section-card">
                    <h2 class="text-xl font-bold text-white mb-4 border-b border-slate-700 pb-2 flex items-center gap-2"><i data-lucide="search"></i> SEO & Footer</h2>
                    <div class="input-group">
                        <label class="input-label">Default SEO Title</label>
                        <input type="text" id="g-seo-title" class="input-field">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Default SEO Description</label>
                        <textarea id="g-seo-desc" class="input-field h-20"></textarea>
                    </div>
                    <div class="input-group mt-4">
                        <label class="input-label">Footer Description</label>
                        <textarea id="g-footer-desc" class="input-field h-20"></textarea>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Footer Copyright</label>
                        <input type="text" id="g-footer-copy" class="input-field">
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab: Home Page -->
        <div id="tab-home" class="tab-content hidden">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <!-- Hero Section -->
                <div class="section-card">
                    <h2 class="text-xl font-bold text-white mb-4 border-b border-slate-700 pb-2 flex items-center gap-2"><i data-lucide="layout-template"></i> Hero Section</h2>
                    <div class="input-group">
                        <label class="input-label">Badge Text</label>
                        <input type="text" id="h-badge" class="input-field">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Title (HTML supported)</label>
                        <textarea id="h-title" class="input-field h-20"></textarea>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Subtitle</label>
                        <textarea id="h-subtitle" class="input-field h-20"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="input-group">
                            <label class="input-label">Primary CTA Text</label>
                            <input type="text" id="h-cta1" class="input-field">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Secondary CTA Text</label>
                            <input type="text" id="h-cta2" class="input-field">
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Hero Image URL</label>
                        <div class="flex gap-2">
                            <input type="text" id="h-image" class="input-field">
                            <input type="file" id="h-image-upload" class="hidden" accept="image/*" onchange="handleImageUpload(this, 'h-image')">
                            <button onclick="document.getElementById('h-image-upload').click()" class="btn-primary text-xs whitespace-nowrap">Upload</button>
                        </div>
                    </div>
                </div>

                <!-- Stats -->
                <div class="section-card">
                    <h2 class="text-xl font-bold text-white mb-4 border-b border-slate-700 pb-2 flex items-center gap-2"><i data-lucide="bar-chart"></i> Stats Section</h2>
                    <div id="h-stats-container" class="space-y-4">
                        <!-- Injected via JS -->
                    </div>
                </div>
            </div>
            
            <div class="section-card mt-6">
                <h2 class="text-xl font-bold text-white mb-4 border-b border-slate-700 pb-2 flex items-center gap-2"><i data-lucide="message-square"></i> Testimonials</h2>
                <div class="flex flex-col md:flex-row gap-6">
                    <div class="w-full md:w-1/3 h-64 overflow-y-auto bg-[#0f172a] rounded-lg p-2">
                        <button onclick="addTestimonial()" class="w-full mb-4 btn-primary text-sm">+ Add Testimonial</button>
                        <div id="testi-list" class="space-y-1"></div>
                    </div>
                    <div class="w-full md:w-2/3 hidden" id="testi-editor">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-bold">Edit Testimonial</h3>
                            <button onclick="deleteTestimonial()" class="text-red-400 text-sm hover:underline">Delete</button>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="input-group">
                                <label class="input-label">Author Name</label>
                                <input type="text" id="t-author" class="input-field">
                            </div>
                            <div class="input-group">
                                <label class="input-label">Role / Company</label>
                                <input type="text" id="t-role" class="input-field">
                            </div>
                        </div>
                        <div class="input-group">
                            <label class="input-label">Avatar Image URL</label>
                            <input type="text" id="t-image" class="input-field">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Quote</label>
                            <textarea id="t-quote" class="input-field h-24"></textarea>
                        </div>
                        <button onclick="saveTestimonial()" class="btn-primary w-full">Update Testimonial</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab: Services -->
        <div id="tab-services" class="tab-content hidden">
            <div class="flex flex-col md:flex-row gap-6 h-auto md:h-[calc(100vh-200px)]">
                <!-- List -->
                <div class="w-full md:w-1/4 h-64 md:h-full overflow-y-auto bg-[#1e293b] border border-slate-700 rounded-lg p-2">
                    <button onclick="addService()" class="w-full mb-4 btn-primary text-sm">+ Add Service</button>
                    <div id="service-list" class="space-y-1"></div>
                </div>
                <!-- Editor -->
                <div class="w-full md:w-3/4 h-auto md:h-full overflow-y-auto bg-[#1e293b] border border-slate-700 rounded-lg p-6 hidden" id="service-editor">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-white">Edit Service</h2>
                        <button onclick="deleteService()" class="text-red-400 text-sm hover:underline">Delete Service</button>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Title</label>
                        <input type="text" id="s-title" class="input-field">
                    </div>
                    <div class="input-group">
                        <label class="input-label">Description</label>
                        <textarea id="s-desc" class="input-field h-24"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="input-group">
                            <label class="input-label">Icon URL (SVG/PNG)</label>
                            <input type="text" id="s-image" class="input-field">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Link (e.g. /services/seo)</label>
                            <input type="text" id="s-link" class="input-field">
                        </div>
                    </div>
                    <button onclick="saveService()" class="btn-primary w-full mt-4">Update Service</button>
                </div>
            </div>
        </div>

        <!-- Tab: Portfolio -->
        <div id="tab-portfolio" class="tab-content hidden">
            <div class="flex flex-col md:flex-row gap-6 h-auto md:h-[calc(100vh-200px)]">
                <div class="w-full md:w-1/4 h-64 md:h-full overflow-y-auto bg-[#1e293b] border border-slate-700 rounded-lg p-2">
                    <button onclick="addStudy()" class="w-full mb-4 btn-primary text-sm">+ Add Case Study</button>
                    <div id="study-list" class="space-y-1"></div>
                </div>
                <div class="w-full md:w-3/4 h-auto md:h-full overflow-y-auto bg-[#1e293b] border border-slate-700 rounded-lg p-6 hidden" id="study-editor">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-white">Edit Case Study</h2>
                        <button onclick="deleteStudy()" class="text-red-400 text-sm hover:underline">Delete</button>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="input-group">
                            <label class="input-label">Title</label>
                            <input type="text" id="cs-title" class="input-field">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Client Name</label>
                            <input type="text" id="cs-client" class="input-field">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="input-group">
                            <label class="input-label">Category</label>
                            <input type="text" id="cs-category" class="input-field">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Slug</label>
                            <input type="text" id="cs-slug" class="input-field">
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Featured Image URL</label>
                        <div class="flex gap-2">
                            <input type="text" id="cs-image" class="input-field">
                            <input type="file" id="cs-image-upload" class="hidden" accept="image/*" onchange="handleImageUpload(this, 'cs-image')">
                            <button onclick="document.getElementById('cs-image-upload').click()" class="btn-primary text-xs whitespace-nowrap">Upload</button>
                        </div>
                    </div>
                    
                    <div class="grid grid-cols-3 gap-4 mb-4">
                        <div class="input-group">
                            <label class="input-label">Metric 1</label>
                            <input type="text" id="cs-m1" class="input-field" placeholder="+150% Traffic">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Metric 2</label>
                            <input type="text" id="cs-m2" class="input-field" placeholder="3x ROI">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Metric 3</label>
                            <input type="text" id="cs-m3" class="input-field" placeholder="-40% CPA">
                        </div>
                    </div>

                    <div class="input-group">
                        <label class="input-label">Challenge</label>
                        <textarea id="cs-challenge" class="input-field h-24"></textarea>
                    </div>
                    
                    <div class="input-group h-[300px] mb-12">
                        <label class="input-label">Solution & Results (Rich Text)</label>
                        <div id="cs-quill" class="h-[220px] bg-slate-800"></div>
                    </div>

                    <button onclick="saveStudy()" class="btn-primary w-full">Update Case Study</button>
                </div>
            </div>
        </div>

        <!-- Tab: Blog -->
        <div id="tab-blog" class="tab-content hidden">
            <div class="flex flex-col md:flex-row gap-6 h-auto md:h-[calc(100vh-200px)]">
                <div class="w-full md:w-1/4 h-64 md:h-full overflow-y-auto bg-[#1e293b] border border-slate-700 rounded-lg p-2">
                    <button onclick="addBlog()" class="w-full mb-4 btn-primary text-sm">+ Add Post</button>
                    <div id="blog-list" class="space-y-1"></div>
                </div>
                <div class="w-full md:w-3/4 h-auto md:h-full overflow-y-auto bg-[#1e293b] border border-slate-700 rounded-lg p-6 hidden" id="blog-editor">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-xl font-bold text-white">Edit Post</h2>
                        <button onclick="deleteBlog()" class="text-red-400 text-sm hover:underline">Delete</button>
                    </div>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div class="input-group">
                            <label class="input-label">Title</label>
                            <input type="text" id="b-title" class="input-field">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Category</label>
                            <input type="text" id="b-category" class="input-field">
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="input-group">
                            <label class="input-label">Slug</label>
                            <input type="text" id="b-slug" class="input-field">
                        </div>
                        <div class="input-group">
                            <label class="input-label">Date</label>
                            <input type="text" id="b-date" class="input-field">
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Featured Image URL</label>
                        <div class="flex gap-2">
                            <input type="text" id="b-image" class="input-field">
                            <input type="file" id="b-image-upload" class="hidden" accept="image/*" onchange="handleImageUpload(this, 'b-image')">
                            <button onclick="document.getElementById('b-image-upload').click()" class="btn-primary text-xs whitespace-nowrap">Upload</button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label class="input-label">Excerpt</label>
                        <textarea id="b-excerpt" class="input-field h-20"></textarea>
                    </div>

                    <div class="input-group h-[400px] mb-12">
                        <label class="input-label">Content (Rich Text)</label>
                        <div id="blog-quill" class="h-[320px] bg-slate-800"></div>
                    </div>

                    <button onclick="saveBlog()" class="btn-primary w-full">Update Post</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Global Save Action -->
    <div id="global-save-bar" class="fixed bottom-0 left-0 w-full bg-[#1e293b] border-t border-slate-700 p-4 flex items-center justify-between z-40 shadow-2xl hidden">
        <div class="text-sm text-slate-400 flex items-center gap-2">
            <i data-lucide="info" class="w-4 h-4"></i> Click Save & Rebuild to publish changes to the live site.
        </div>
        <div class="flex gap-2">
            <button onclick="saveToDisk()" id="save-btn" class="btn-success flex items-center gap-2">
                <i data-lucide="save"></i> Save & Rebuild Site
            </button>
        </div>
    </div>

    <script>
        // Load site_data.js with cache-busting, then init admin
        (function() {
            var s = document.createElement('script');
            s.src = 'site_data.js?v=' + Date.now();
            s.onload = function() {
                // Now load admin.js after data is ready
                var a = document.createElement('script');
                a.src = 'js/admin.js';
                document.body.appendChild(a);
            };
            s.onerror = function() {
                alert('ERROR: Could not load site_data.js. Make sure the dev server is running.');
            };
            document.body.appendChild(s);
        })();
    </script>
</body>
</html>
